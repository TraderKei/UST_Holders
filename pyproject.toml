[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tic-holdings-pipeline"
version = "0.1.0"
description = "Auditable U.S. Treasury TIC holdings ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-json-logger>=2,<4",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "testcontainers[postgres]>=4.8,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires Docker and PostgreSQL"]

